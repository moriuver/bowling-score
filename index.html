<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎳 ボウリング スコア</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap');
:root{--bg:#0f0f14;--surface:#1a1a24;--card:#22222e;--accent:#f0c040;--accent2:#e05a2b;--green:#3ecf6e;--text:#f0ede8;--border:#2e2e3e;--goriyaku:#c07aff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:80px}
header{background:var(--surface);border-bottom:2px solid var(--accent);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
header h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;color:var(--accent)}
.game-count{background:var(--accent2);color:#fff;font-weight:900;font-size:.7rem;padding:4px 10px;border-radius:20px;letter-spacing:1px}
.sync-status{font-size:.65rem;padding:3px 8px;border-radius:20px;font-weight:700}
.sync-status.ok{background:rgba(62,207,110,.15);color:var(--green)}
.sync-status.ng{background:rgba(224,90,43,.15);color:var(--accent2)}
.sync-status.loading{background:rgba(240,192,64,.15);color:var(--accent)}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:190}
.tab{flex:1;padding:11px 2px;text-align:center;font-size:.7rem;font-weight:700;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.section{margin:14px 14px 0}
.section-label{font-size:.63rem;color:#777;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.pt-pos{color:var(--green)}.pt-neg{color:var(--accent2)}.pt-zero{color:#555}
.count-stepper{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}
.step-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.step-btn:active{background:var(--accent);color:var(--bg)}
.step-btn:disabled{color:#444;cursor:not-allowed}
.step-display{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--accent);letter-spacing:2px;min-width:80px;text-align:center}
.step-display .unit{font-size:1rem;color:#888;margin-left:4px}
.roster-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.roster-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.roster-row .rname{flex:1;font-size:.88rem;font-weight:700}
.roster-del{background:none;border:none;color:#444;font-size:.95rem;cursor:pointer;padding:2px 6px;transition:color .15s}
.roster-del:active{color:var(--accent2)}
.roster-add-row{display:flex;gap:8px}
.roster-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.88rem;font-weight:700;outline:none;transition:border-color .15s}
.roster-input:focus{border-color:var(--accent)}
.roster-input::placeholder{color:#444;font-weight:400}
.roster-add-btn{background:var(--accent);color:var(--bg);border:none;border-radius:10px;padding:10px 16px;font-family:'Noto Sans JP',sans-serif;font-size:.85rem;font-weight:900;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.roster-add-btn:active{opacity:.7}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot-wrap{position:relative}
.slot-select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 32px 10px 12px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.88rem;font-weight:700;outline:none;cursor:pointer;-webkit-appearance:none;transition:border-color .15s}
.slot-select:focus{border-color:var(--accent)}
.slot-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.7rem;color:#666;pointer-events:none}
.game-section{margin:14px 14px 0}
.game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.game-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--accent);letter-spacing:2px}
.add-game-btn{background:var(--accent);color:var(--bg);border:none;border-radius:20px;padding:7px 14px;font-family:'Noto Sans JP',sans-serif;font-size:.78rem;font-weight:900;cursor:pointer;transition:opacity .15s}
.add-game-btn:active{opacity:.7}
.game-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.game-card-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:rgba(77,216,240,.06);border-bottom:1px solid rgba(77,216,240,.18)}
.game-num{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:#4dd8f0;letter-spacing:2px;filter:drop-shadow(0 0 4px rgba(77,216,240,.55))}
.game-card-actions{display:flex;gap:6px;align-items:center}
.pts-toggle-btn{background:rgba(240,192,64,.1);border:1px solid rgba(240,192,64,.35);border-radius:6px;color:#f0c040;font-size:.65rem;font-weight:700;padding:3px 8px;cursor:pointer;transition:all .15s}
.pts-toggle-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(240,192,64,.18)}
.del-btn{background:rgba(224,90,43,.08);border:1px solid rgba(224,90,43,.3);border-radius:6px;color:#e05a2b;font-size:.85rem;cursor:pointer;padding:3px 8px;transition:all .15s}
.del-btn:active{color:var(--accent2)}
.game-pts-area{padding:10px 14px;border-bottom:1px solid rgba(240,192,64,.25);background:rgba(240,192,64,.06);display:none}
.game-pts-area.open{display:block}
.game-pts-grid{display:flex;flex-wrap:wrap;gap:8px}
.game-pts-item{display:flex;align-items:center;gap:5px}
.game-pts-item label{font-size:.7rem;color:var(--accent);font-weight:700;min-width:22px}
.game-pts-input{background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1rem;padding:5px 8px;width:62px;outline:none;text-align:center;transition:border-color .15s}
.game-pts-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(240,192,64,.2)}
.rank-inputs{padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.rank-row{display:flex;align-items:center;gap:10px}
.rank-row .pname{flex:1;font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.83rem;font-weight:700;padding:7px 8px;outline:none;width:80px;cursor:pointer;transition:border-color .15s;-webkit-appearance:none;text-align:center}
.rank-select:focus{border-color:var(--accent)}
.pt-preview{min-width:42px;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px}
.dup-warn{font-size:.7rem;color:var(--accent2);padding:0 14px 10px}
#panel-record .total-sticky{position:sticky;top:94px;z-index:50;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.total-sticky-inner{display:flex;gap:6px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.total-sticky-inner::-webkit-scrollbar{display:none}
.total-pill{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:6px;min-width:max-content}
.total-pill.rank-1{background:rgba(240,192,64,.1);border-color:rgba(240,192,64,.4)}
.total-pill.rank-2{background:rgba(176,176,192,.06);border-color:rgba(176,176,192,.3)}
.total-pill.rank-3{background:rgba(205,127,50,.06);border-color:rgba(205,127,50,.3)}
.total-pill .pill-medal{font-size:.85rem}
.total-pill .pill-name{font-size:.72rem;font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.total-pill .pill-score{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:.5px;line-height:1}
.total-empty{color:#444;font-size:.72rem;padding:6px 14px;text-align:center;width:100%}
.balance-section{margin:10px 14px 0}
.balance-card{border-radius:12px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border:1px solid}
.balance-card.ok{background:rgba(62,207,110,.07);border-color:var(--green)}
.balance-card.ng{background:rgba(224,90,43,.07);border-color:var(--accent2)}
.balance-left{display:flex;align-items:center;gap:10px}
.balance-icon{font-size:1.4rem}
.balance-title{font-size:.78rem;font-weight:900;margin-bottom:2px}
.balance-sub{font-size:.68rem;color:#777}
.balance-num{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:1px}
.balance-card.ok .balance-num{color:var(--green)}
.balance-card.ng .balance-num{color:var(--accent2)}
/* ご祝儀セクション */
.goriyaku-section{margin:14px 14px 0}
.goriyaku-card{background:var(--card);border:1px solid var(--goriyaku);border-radius:12px;overflow:hidden}
.goriyaku-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(192,122,255,.08);border-bottom:1px solid rgba(192,122,255,.2)}
.goriyaku-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--goriyaku);letter-spacing:2px}
.goriyaku-threshold-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.goriyaku-threshold-label{font-size:.75rem;color:#aaa;white-space:nowrap}
.goriyaku-threshold-input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1.1rem;padding:6px 10px;width:80px;outline:none;text-align:center;transition:border-color .15s}
.goriyaku-threshold-input:focus{border-color:var(--goriyaku)}
.goriyaku-threshold-unit{font-size:.75rem;color:#888}
.goriyaku-players{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.goriyaku-empty{padding:14px;text-align:center;font-size:.75rem;color:#555}
.goriyaku-player-row{display:flex;align-items:center;gap:10px}
.goriyaku-player-name{flex:1;font-size:.85rem;font-weight:700}
.goriyaku-player-score{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--goriyaku);min-width:50px}
.goriyaku-amount-wrap{display:flex;align-items:center;gap:4px}
.goriyaku-amount-input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1rem;padding:6px 8px;width:80px;outline:none;text-align:center;transition:border-color .15s}
.goriyaku-amount-input:focus{border-color:var(--goriyaku)}
.goriyaku-amount-unit{font-size:.72rem;color:#888}
.goriyaku-total-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);background:rgba(192,122,255,.05)}
.goriyaku-total-label{font-size:.75rem;color:#aaa}
.goriyaku-total-num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--goriyaku);letter-spacing:1px}
/* ゲームカード内ご祝儀 */
.goriyaku-toggle-btn{background:rgba(192,122,255,.08);border:1px solid rgba(192,122,255,.3);border-radius:6px;color:#c07aff;font-size:.65rem;font-weight:700;padding:3px 8px;cursor:pointer;transition:all .15s}
.goriyaku-toggle-btn.active{background:rgba(192,122,255,.22);border-color:var(--goriyaku);color:var(--goriyaku)}
.game-goriyaku-area{padding:10px 14px;border-bottom:1px solid rgba(192,122,255,.2);background:rgba(192,122,255,.04);display:none}
.game-goriyaku-area.open{display:block}
.game-goriyaku-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.game-goriyaku-select{flex:1;min-width:0;background:var(--surface);border:1px solid rgba(192,122,255,.3);border-radius:8px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.8rem;font-weight:700;padding:7px 10px;outline:none;cursor:pointer;-webkit-appearance:none;transition:border-color .15s}
.game-goriyaku-select:focus{border-color:var(--goriyaku)}
.game-goriyaku-amount{background:var(--surface);border:1px solid rgba(192,122,255,.3);border-radius:8px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1rem;padding:7px 8px;width:80px;outline:none;text-align:center;transition:border-color .15s}
.game-goriyaku-amount:focus{border-color:var(--goriyaku)}
.game-goriyaku-add-btn{background:var(--goriyaku);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-family:'Noto Sans JP',sans-serif;font-size:.75rem;font-weight:900;cursor:pointer;white-space:nowrap;transition:opacity .15s;flex-shrink:0}
.game-goriyaku-add-btn:active{opacity:.7}
.game-goriyaku-items{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.game-goriyaku-item{display:flex;align-items:center;gap:6px;background:rgba(192,122,255,.08);border-radius:6px;padding:5px 8px;font-size:.8rem}
.game-goriyaku-item-name{flex:1;font-weight:700}
.game-goriyaku-item-amount{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--goriyaku)}
.game-goriyaku-item-del{background:none;border:none;color:#666;font-size:.8rem;cursor:pointer;padding:1px 5px;transition:color .15s;flex-shrink:0}
.game-goriyaku-item-del:active{color:var(--accent2)}

/* ご祝儀 追加フォーム */
.goriyaku-add-form{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.goriyaku-add-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.goriyaku-select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.8rem;font-weight:700;padding:8px 10px;outline:none;cursor:pointer;-webkit-appearance:none;transition:border-color .15s}
.goriyaku-select:focus{border-color:var(--goriyaku)}
.goriyaku-add-amount{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1rem;padding:7px 10px;width:90px;outline:none;text-align:center;transition:border-color .15s}
.goriyaku-add-amount:focus{border-color:var(--goriyaku)}
.goriyaku-add-btn{background:var(--goriyaku);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:'Noto Sans JP',sans-serif;font-size:.78rem;font-weight:900;cursor:pointer;white-space:nowrap;transition:opacity .15s;flex-shrink:0}
.goriyaku-add-btn:active{opacity:.7}
/* ご祝儀 追加済みリスト */
.goriyaku-list{padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.goriyaku-list-empty{padding:12px;text-align:center;font-size:.75rem;color:#555}
.goriyaku-item{display:flex;align-items:center;gap:8px;background:rgba(192,122,255,.06);border:1px solid rgba(192,122,255,.15);border-radius:8px;padding:8px 10px}
.goriyaku-item-game{font-size:.65rem;color:var(--goriyaku);font-family:'Bebas Neue',sans-serif;letter-spacing:1px;min-width:52px}
.goriyaku-item-name{flex:1;font-size:.82rem;font-weight:700}
.goriyaku-item-amount{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--goriyaku);min-width:70px;text-align:right}
.goriyaku-item-del{background:none;border:none;color:#444;font-size:.85rem;cursor:pointer;padding:2px 6px;transition:color .15s;flex-shrink:0}
.goriyaku-item-del:active{color:var(--accent2)}
/* 履歴のご祝儀表示 */
.hist-goriyaku-block{margin-top:8px;padding:8px 10px;background:rgba(192,122,255,.07);border:1px solid rgba(192,122,255,.2);border-radius:8px}
.hist-goriyaku-label{font-size:.63rem;color:var(--goriyaku);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.hist-goriyaku-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;font-size:.78rem}
.hist-goriyaku-name{font-weight:700}
.hist-goriyaku-amount{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--goriyaku)}
.action-row{display:flex;gap:10px;margin:14px 14px 0}
.save-btn{flex:2;padding:14px;background:var(--accent);border:none;border-radius:12px;color:var(--bg);font-family:'Noto Sans JP',sans-serif;font-size:.88rem;font-weight:900;cursor:pointer;transition:opacity .15s}
.save-btn:active{opacity:.7}
.reset-btn{flex:1;padding:14px;background:none;border:1px solid #333;border-radius:12px;color:#555;font-family:'Noto Sans JP',sans-serif;font-size:.85rem;cursor:pointer;transition:all .15s}
.reset-btn:active{border-color:var(--accent2);color:var(--accent2)}
.stats-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:14px 14px 0}
.stats-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.stats-row:last-child{border-bottom:none}
.stats-row.rank-1{background:rgba(240,192,64,.07)}
.stats-row.rank-2{background:rgba(176,176,192,.04)}
.stats-row.rank-3{background:rgba(205,127,50,.04)}
.stats-left{display:flex;align-items:center;gap:10px}
.stats-medal{font-size:1.2rem;min-width:26px;text-align:center}
.stats-name{font-size:.92rem;font-weight:900}
.stats-right{text-align:right}
.stats-total{font-family:'Bebas Neue',sans-serif;font-size:1.65rem;letter-spacing:1px}
.stats-sub{font-size:.65rem;color:#777;margin-top:1px}
.stats-empty{padding:30px 16px;text-align:center;color:#555;font-size:.82rem}
.hist-empty{text-align:center;padding:50px 20px;color:#555;font-size:.85rem;line-height:2}
.hist-session{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:14px 14px 0;overflow:hidden}
.hist-session-header{display:flex;align-items:center;justify-content:space-between;padding:0;background:rgba(255,255,255,.025);border-bottom:1px solid var(--border)}
.hist-session-info{flex:1;padding:12px 14px;cursor:pointer;min-width:0}
.hist-chevron{font-size:.7rem;color:#666;margin-left:4px}
.hist-date{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--accent);letter-spacing:2px}
.hist-meta{font-size:.7rem;color:#666;margin-top:2px}
.hist-header-actions{display:flex;gap:6px;align-items:center;padding:8px 14px 8px 0;flex-shrink:0;position:relative;z-index:10}
.hist-edit-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:#aaa;font-size:1rem;font-weight:700;padding:8px 12px;cursor:pointer;transition:all .15s;min-width:44px;min-height:40px}
.hist-edit-btn:active,.hist-edit-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(240,192,64,.1)}
.hist-del-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:#aaa;font-size:1rem;cursor:pointer;padding:8px 12px;transition:all .15s;min-width:44px;min-height:40px}
.hist-del-btn:active{color:var(--accent2);border-color:var(--accent2);background:rgba(224,90,43,.1)}
.hist-body{display:none}.hist-body.open{display:block}
.hist-view{padding:12px 16px}
.hist-ranking{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.hist-rank-row{display:flex;align-items:center;justify-content:space-between}
.hist-rank-left{display:flex;align-items:center;gap:8px}
.hist-rank-medal{font-size:1.1rem;min-width:22px}
.hist-rank-name{font-size:.85rem;font-weight:700}
.hist-rank-score{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px}
.hist-games-label{font-size:.63rem;color:#666;text-transform:uppercase;letter-spacing:1.5px;margin:8px 0 6px}
.hist-game-item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:.75rem}
.hist-game-title{font-family:'Bebas Neue',sans-serif;font-size:.85rem;color:#777;letter-spacing:1px;margin-bottom:5px}
.hist-game-rows{display:flex;flex-direction:column;gap:3px}
.hist-game-prow{display:flex;align-items:center;justify-content:space-between;color:#999}
.hist-game-prow .hgp-name{font-weight:700;color:var(--text);font-size:.78rem}
.hist-game-prow .hgp-rank{color:#777;font-size:.72rem}
.hist-game-prow .hgp-pt{font-family:'Bebas Neue',sans-serif;font-size:.95rem}
.hist-edit{padding:12px 16px}

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ------------------------------------------------------
// Firebaseが読み込めない時（プレビュー表示・電波不良など）でも画面が止まらないようにする
// ------------------------------------------------------
var FB_OK=false,db=null;
try{
  if(typeof firebase!=='undefined'){
    firebase.initializeApp({databaseURL:"https://bowling-score-c7380-default-rtdb.firebaseio.com/"});
    db=firebase.database();FB_OK=true;
  }
}catch(e){console.error(e);FB_OK=false;}
if(!FB_OK)db=createLocalDb();

// 端末内だけで動く簡易データベース（共有はされない）
function createLocalDb(){
  var KEY='bowling_local_db',mem=null,listeners=[];
  function load(){if(mem!==null)return mem;try{var r=localStorage.getItem(KEY);mem=r?JSON.parse(r):null;}catch(e){mem=null;}return mem;}
  function store(v){mem=v==null?null:JSON.parse(JSON.stringify(v));try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}
    setTimeout(function(){listeners.forEach(function(cb){cb(snap());});},0);}
  function snap(){var v=load();var copy=v==null?null:JSON.parse(JSON.stringify(v));return{val:function(){return copy;},exists:function(){return copy!=null;}};}
  return{ref:function(path){
    if(path==='.info/connected')return{on:function(ev,cb){setTimeout(function(){cb({val:function(){return false;}});},0);}};
    return{
      get:function(){return Promise.resolve(snap());},
      on:function(ev,cb){listeners.push(cb);setTimeout(function(){cb(snap());},0);},
      set:function(v){store(v);return Promise.resolve();},
      transaction:function(fn){var r=fn(snap().val());if(r===undefined)return Promise.resolve({committed:false,snapshot:snap()});store(r);return Promise.resolve({committed:true,snapshot:snap()});}
    };
  }};
}
var MEDALS=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
var MIN_PLAYERS=2,MAX_PLAYERS=12;
var playerCount=4,selectedSlots=['','','',''],games=[];
var cachedData={roster:[],sessions:[]};
var editStates={};
// ご祝儀データ（記録中のみ、保存時にセッションへ含める）
var goriyakuItems=[];  // [{gameIdx, playerIdx, playerName, amount}]

var currentSessionId=null;   // 保存済みセッションID（2回目以降の保存は上書き）
var isDirty=false;           // 前回保存後に変更があるか
var isConnected=true;
var isSaving=false;
var DRAFT_KEY='bowling_draft_v1';

// HTMLエスケープ（名前に " < & などが入っても画面が壊れないように）
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function setSyncStatus(state){
  var el=document.getElementById('syncStatus');if(!el)return;
  if(state==='ok'&&!isConnected)state='ng';
  if(state==='ok'){el.textContent='✓ 同期済';el.className='sync-status ok';}
  else if(state==='ng'){el.textContent='✗ オフライン';el.className='sync-status ng';}
  else{el.textContent='⟳ 同期中';el.className='sync-status loading';}
}

// ------------------------------------------------------
// Firebaseは配列内のnullや空配列を消してしまうため、読み込むたびに形を整える
// ------------------------------------------------------
function toArr(v){
  if(Array.isArray(v))return v.slice();
  if(v&&typeof v==='object'){var a=[];Object.keys(v).forEach(function(k){var i=parseInt(k);if(!isNaN(i))a[i]=v[k];});return a;}
  return[];
}
function normalizeSession(s){
  if(!s||typeof s!=='object')return null;
  var n=parseInt(s.playerCount)||0;
  var names=toArr(s.names);
  if(n<names.length)n=names.length;
  var games=toArr(s.games).filter(function(g){return g!=null;}).map(function(g){
    var r=toArr(g.ranks);
    for(var i=0;i<n;i++){var v=r[i];r[i]=(v==='dnp')?'dnp':(v==null||v===''||isNaN(parseInt(v))||parseInt(v)<1||parseInt(v)>n)?null:parseInt(v);}
    r.length=n;
    var cp=g.customPoints?toArr(g.customPoints):null;
    if(cp){for(var j=0;j<n;j++)cp[j]=parseInt(cp[j])||0;cp.length=n;}
    return{ranks:r,customPoints:cp};
  });
  for(var k=0;k<n;k++)names[k]=names[k]==null?'':String(names[k]);
  names.length=n;
  var totals=Array(n).fill(0);
  games.forEach(function(g){var pts=g.customPoints||defaultPtsForCount(n);g.ranks.forEach(function(r,pi){if(r!==null&&r!=='dnp')totals[pi]+=(pts[r-1]||0);});});
  var out={id:s.id,date:s.date||'',playerCount:n,names:names,games:games,totals:totals};
  if(s.goriyaku){
    var items=toArr(s.goriyaku.items).filter(function(it){return it&&typeof it==='object';}).map(function(it){
      return{gameIdx:parseInt(it.gameIdx)||0,playerIdx:parseInt(it.playerIdx)||0,playerName:it.playerName||'',amount:parseInt(it.amount)||0};
    });
    if(items.length>0)out.goriyaku={items:items};
    // 旧形式（閾値方式）のご祝儀：表示だけする（データはサーバー上にそのまま残る）
    if(s.goriyaku.amounts&&typeof s.goriyaku.amounts==='object'){
      out.legacyGoriyaku=Object.keys(s.goriyaku.amounts).map(function(k){var a=s.goriyaku.amounts[k]||{};return{name:a.name||'',amount:parseInt(a.amount)||0};}).filter(function(a){return a.amount>0;});
    }
  }
  out.yen=yenTotals(totals,games,out.goriyaku?out.goriyaku.items:[]);
  return out;
}
function normalizeData(d){
  d=(d&&typeof d==='object')?d:{};
  var roster=toArr(d.roster).filter(function(x){return typeof x==='string'&&x.trim()!=='';});
  var sessions=toArr(d.sessions).map(function(s,i){var n=normalizeSession(s);if(n&&n.id==null)n.id=-(i+1);return n;}).filter(function(s){return s!=null;});
  return{roster:roster,sessions:sessions};
}

function loadData(cb){
  setSyncStatus('loading');
  db.ref('bowling').get().then(function(snap){
    cachedData=normalizeData(snap.val());
    setSyncStatus('ok');
    if(cb)cb();
  }).catch(function(e){setSyncStatus('ng');console.error(e);if(cb)cb();});
}

// ------------------------------------------------------
// 保存はトランザクションで「サーバー上の最新データ」に対して変更を適用する
// （他の端末がほぼ同時に保存しても、互いの記録を消さない）
// mutator(data) は data を書き換える関数。false を返すと中止。
// ------------------------------------------------------
// opts.allowDelete: 記録を1件削除する操作のときだけ true
function updateData(mutator,onDone,onFail,opts){
  opts=opts||{};
  setSyncStatus('loading');
  if(!FB_OK)showToast('⚠ サーバー未接続のため、この端末にだけ保存します');
  else if(!isConnected)showToast('📡 オフラインです。接続が戻ると保存されます');
  var guardFailed=false;
  ensureDailyBackup(function(){
  db.ref('bowling').transaction(function(cur){
    // 【履歴保護】サーバー上のデータをそのままコピーして、変更する所だけ書き換える
    //  （他の記録・古い形式のデータ・知らない項目は一切いじらない）
    var d=(cur&&typeof cur==='object')?JSON.parse(JSON.stringify(cur)):{};
    d.roster=toArr(d.roster).filter(function(x){return x!=null;});
    d.sessions=toArr(d.sessions).filter(function(x){return x!=null;});
    var before=d.sessions.length;
    if(mutator(d)===false)return;   // undefined を返すと中止
    var after=d.sessions.length;
    // 【履歴保護】削除操作以外で記録が減る／削除でも2件以上減る書き込みは止める
    if(after<before&&!(opts.allowDelete&&after===before-1)){guardFailed=true;return;}
    return d;
  }).then(function(res){
    setSyncStatus('ok');
    if(res&&res.committed){
      cachedData=normalizeData(res.snapshot.val());
      if(onDone)onDone();
    }else{
      if(guardFailed)showToast('🛡 履歴が消える恐れのある保存を止めました（データは無事です）');
      if(onFail)onFail(guardFailed?'guard':undefined);
    }
  }).catch(function(e){
    setSyncStatus('ng');console.error(e);
    showToast('⚠ 保存に失敗しました。通信状況を確認して再度お試しください');
    if(onFail)onFail(e);
  });
  });
}

// ------------------------------------------------------
// 【履歴保護】自動バックアップ
//   その日最初の保存の前に、サーバー上の全データを bowling_backups/日付 にコピー（30日分保持）
// ------------------------------------------------------
var backupDoneDate=null;
function todayKey(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function ensureDailyBackup(next){
  var key=todayKey();
  if(!FB_OK||backupDoneDate===key){next();return;}
  var called=false,go=function(){if(!called){called=true;next();}};
  setTimeout(go,4000);  // バックアップが遅くても保存は止めない
  db.ref('bowling_backups/'+key).get().then(function(snap){
    if(snap.exists()){backupDoneDate=key;go();return;}
    return db.ref('bowling').get().then(function(cur){
      if(!cur.exists()){go();return;}
      return db.ref('bowling_backups/'+key).set({savedAt:Date.now(),data:cur.val()}).then(function(){backupDoneDate=key;pruneBackups();go();});
    });
  }).catch(function(e){console.warn('backup failed',e);go();});
}
function pruneBackups(){
  db.ref('bowling_backups').get().then(function(snap){
    var keys=Object.keys(snap.val()||{}).sort();
    keys.slice(0,Math.max(0,keys.length-30)).forEach(function(k){db.ref('bowling_backups/'+k).remove();});
  }).catch(function(){});
}
// バックアップファイルをダウンロード
function downloadBackup(){
  db.ref('bowling').get().then(function(snap){
    var blob=new Blob([JSON.stringify({app:'bowling-score',exportedAt:new Date().toISOString(),data:snap.val()},null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bowling-backup-'+todayKey()+'.json';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
    showToast('📦 バックアップを保存しました');
  }).catch(function(){showToast('⚠ バックアップに失敗しました');});
}
// サーバー上のバックアップ一覧
function renderBackupList(){
  var el=document.getElementById('backupList');if(!el)return;
  if(!FB_OK){el.innerHTML='<div class="backup-empty">サーバー未接続のため表示できません</div>';return;}
  el.innerHTML='<div class="backup-empty">読み込み中…</div>';
  db.ref('bowling_backups').get().then(function(snap){
    var v=snap.val()||{},keys=Object.keys(v).sort().reverse();
    if(!keys.length){el.innerHTML='<div class="backup-empty">まだ自動バックアップはありません（次に保存した時に作られます）</div>';return;}
    el.innerHTML=keys.map(function(k){
      var d=v[k]&&v[k].data,n=d?toArr(d.sessions).filter(function(x){return x;}).length:0;
      return'<div class="backup-row"><span class="backup-date">'+esc(k)+'</span><span class="backup-count">履歴 '+n+'件</span><button class="backup-restore-btn" onclick="restoreBackup(\''+esc(k)+'\')">この日に戻す</button></div>';
    }).join('');
  }).catch(function(){el.innerHTML='<div class="backup-empty">読み込みに失敗しました</div>';});
}
// バックアップから復元（復元前の状態も別名で保存しておく）
function restoreBackup(key){
  if(!confirm(key+' のバックアップに戻しますか？\n\n現在のデータは「復元前」として別に保存されるので、やり直しもできます。'))return;
  db.ref('bowling_backups/'+key).get().then(function(snap){
    var b=snap.val();if(!b||!b.data){showToast('⚠ バックアップが見つかりません');return;}
    return db.ref('bowling').get().then(function(cur){
      var stamp='before-restore-'+todayKey()+'-'+Date.now();
      return db.ref('bowling_backups/'+stamp).set({savedAt:Date.now(),data:cur.val()}).then(function(){
        return db.ref('bowling').set(b.data);
      }).then(function(){showToast('↩ '+key+' の状態に戻しました');renderBackupList();});
    });
  }).catch(function(e){console.error(e);showToast('⚠ 復元に失敗しました');});
}

// ------------------------------------------------------
// 記録中データの端末内バックアップ（iPhoneでタブが破棄・リロードされても復元）
// ------------------------------------------------------
function hasInProgressData(){
  return games.length>0||goriyakuItems.length>0||selectedSlots.some(function(s){return s!=='';});
}
function persistDraft(){
  try{
    if(!hasInProgressData()&&!currentSessionId){localStorage.removeItem(DRAFT_KEY);return;}
    localStorage.setItem(DRAFT_KEY,JSON.stringify({v:1,ts:Date.now(),playerCount:playerCount,selectedSlots:selectedSlots,games:games,goriyakuItems:goriyakuItems,currentSessionId:currentSessionId,isDirty:isDirty}));
  }catch(e){console.warn('draft save failed',e);}
}
function markDirty(){isDirty=true;persistDraft();}
function restoreDraft(){
  try{
    var raw=localStorage.getItem(DRAFT_KEY);if(!raw)return false;
    var d=JSON.parse(raw);if(!d||d.v!==1)return false;
    var n=Math.max(MIN_PLAYERS,Math.min(MAX_PLAYERS,parseInt(d.playerCount)||4));
    playerCount=n;
    selectedSlots=toArr(d.selectedSlots).map(function(s){return s?String(s):'';});
    selectedSlots.length=n;for(var i=0;i<n;i++)if(selectedSlots[i]==null)selectedSlots[i]='';
    games=toArr(d.games).map(function(g){
      var r=toArr(g&&g.ranks);for(var j=0;j<n;j++){var v=r[j];r[j]=v==='dnp'?'dnp':(v==null||isNaN(parseInt(v))?null:Math.min(parseInt(v),n));}r.length=n;
      var cp=g&&g.customPoints?toArr(g.customPoints):null;if(cp){for(var k=0;k<n;k++)cp[k]=parseInt(cp[k])||0;cp.length=n;}
      return{ranks:r,customPoints:cp};
    });
    goriyakuItems=toArr(d.goriyakuItems).filter(function(it){return it&&it.gameIdx<games.length&&it.playerIdx<n;}).map(function(it){
      return{gameIdx:parseInt(it.gameIdx)||0,playerIdx:parseInt(it.playerIdx)||0,playerName:it.playerName||'',amount:parseInt(it.amount)||0};
    });
    currentSessionId=d.currentSessionId||null;
    isDirty=!!d.isDirty;
    return hasInProgressData();
  }catch(e){console.warn('draft restore failed',e);return false;}
}

// ======================================================
// リアルタイム同期（記録中のデータを絶対に上書きしない！）
// ======================================================
var appReady=false;
// 履歴画面で編集中のセッションがあるか（あれば再描画しない＝入力途中の値を守る）
function isEditingHistory(){
  return Object.keys(editStates).some(function(k){return editStates[k]&&editStates[k].editMode;});
}
function refreshActivePanel(){
  var activePanel=document.querySelector('.panel.active');if(!activePanel)return;
  var pid=activePanel.id;
  if(pid==='panel-stats')renderStats();
  if(pid==='panel-history'&&!isEditingHistory())renderHistory();
  if(pid==='panel-users')renderRoster();
}
db.ref('bowling').on('value',function(snap){
  // roster と sessions だけ更新（記録中のgames/selectedSlots/ご祝儀には絶対触れない）
  cachedData=normalizeData(snap.val());
  setSyncStatus('ok');
  if(!appReady)return;
  refreshActivePanel();
  // 名前の選択は壊さずに選択肢だけ静かに更新
  updateNameGridOptions();
},function(err){console.error(err);setSyncStatus('ng');});

// 接続状態の監視（起動直後の一瞬の未接続は表示しない）
var connTimer=null;
db.ref('.info/connected').on('value',function(snap){
  clearTimeout(connTimer);
  if(snap.val()===true){isConnected=true;setSyncStatus('ok');}
  else{connTimer=setTimeout(function(){isConnected=false;setSyncStatus('ng');},3000);}
});

// 既存の選択を保持しつつ選択肢（ユーザー一覧）だけ更新する
function slotOptionsHtml(currentVal){
  var roster=getRoster();
  var opts='<option value="">— 選択 —</option>';
  // ユーザー一覧から削除された名前でも、選択中なら残す
  if(currentVal&&roster.indexOf(currentVal)===-1)opts+='<option value="'+esc(currentVal)+'" selected>'+esc(currentVal)+'</option>';
  roster.forEach(function(name){opts+='<option value="'+esc(name)+'"'+(currentVal===name?' selected':'')+'>'+esc(name)+'</option>';});
  return opts;
}
function updateNameGridOptions(){
  var selects=document.querySelectorAll('#nameGrid .slot-select');
  if(selects.length!==playerCount){renderNameGrid();return;}
  selects.forEach(function(sel,i){
    if(document.activeElement===sel)return;  // 操作中のプルダウンは触らない
    var currentVal=selectedSlots[i]||'';
    sel.innerHTML=slotOptionsHtml(currentVal);
    sel.value=currentVal;
  });
}

function getRoster(){return cachedData.roster||[];}
function getSessions(){return cachedData.sessions||[];}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('active',['record','stats','history','users'][i]===tab);
  });
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='stats')renderStats();
  if(tab==='history')renderHistory();
  if(tab==='users'){renderRoster();renderBackupList();}
}

function renderRoster(){
  var roster=getRoster(),list=document.getElementById('rosterList');
  if(roster.length===0){list.innerHTML='<div style="font-size:.75rem;color:#555;padding:4px 0;">まだユーザーがいません</div>';return;}
  list.innerHTML=roster.map(function(name,i){
    return '<div class="roster-row"><span class="rname">'+esc(name)+'</span><button class="roster-del" onclick="deleteRosterUser('+i+')">✕</button></div>';
  }).join('');
}

function addRosterUser(){
  var inp=document.getElementById('rosterInput'),name=inp.value.trim().slice(0,20);
  if(!name)return;
  if(getRoster().indexOf(name)!==-1){showToast('同じ名前が既にあります');return;}
  updateData(function(d){
    if(d.roster.indexOf(name)!==-1)return false;
    d.roster.push(name);
  },function(){inp.value='';renderRoster();updateNameGridOptions();showToast('👤 追加しました');});
}

function deleteRosterUser(i){
  var name=getRoster()[i];if(name==null)return;
  if(!confirm('「'+name+'」を削除しますか？\n（過去の記録は消えません）'))return;
  // 記録中の選択はそのまま残す（記録途中で名前が消えないように）
  updateData(function(d){
    d.roster=d.roster.filter(function(r){return r!==name;});
  },function(){renderRoster();updateNameGridOptions();});
}

function changeCount(delta){
  var n=Math.max(MIN_PLAYERS,Math.min(MAX_PLAYERS,playerCount+delta));
  if(n===playerCount)return;
  if(n<playerCount){
    // 減らすと消えてしまう入力があれば確認
    var lostRank=games.some(function(g){return g.ranks.slice(n).some(function(r){return r!==null;})||g.ranks.some(function(r){return r!==null&&r!=='dnp'&&r>n;});});
    var lostGor=goriyakuItems.some(function(it){return it.playerIdx>=n;});
    var lostName=selectedSlots.slice(n).some(function(s){return s!=='';});
    if((lostRank||lostGor||lostName)&&!confirm(playerCount+'人目（'+dn(playerCount-1)+'）の入力内容が消えます。\n人数を減らしますか？'))return;
  }
  setCount(n);markDirty();
}

function setCount(n){
  n=Math.max(MIN_PLAYERS,Math.min(MAX_PLAYERS,n));
  playerCount=n;
  var sv=document.getElementById('stepValue'),sd=document.getElementById('stepDown'),su=document.getElementById('stepUp');
  if(sv)sv.textContent=n;
  if(sd)sd.disabled=(n<=MIN_PLAYERS);
  if(su)su.disabled=(n>=MAX_PLAYERS);
  selectedSlots=selectedSlots.slice(0,n);
  while(selectedSlots.length<n)selectedSlots.push('');
  games=games.map(function(g){
    // 人数を超える順位（例：3人なのに4位）は未入力に戻す
    var r=g.ranks.slice(0,n).map(function(x){return(x!==null&&x!=='dnp'&&x>n)?null:x;});while(r.length<n)r.push(null);
    var cp=g.customPoints?g.customPoints.slice(0,n):null;if(cp)while(cp.length<n)cp.push(0);
    return{ranks:r,customPoints:cp};
  });
  goriyakuItems=goriyakuItems.filter(function(it){return it.playerIdx<n;});
  renderNameGrid();renderGames();renderTotals();renderGoriyaku();
}

function renderNameGrid(){
  var grid=document.getElementById('nameGrid');
  grid.innerHTML='';
  for(var i=0;i<playerCount;i++){
    var wrap=document.createElement('div');wrap.className='slot-wrap';
    var sel=document.createElement('select');sel.className='slot-select';
    sel.innerHTML=slotOptionsHtml(selectedSlots[i]||'');
    (function(idx){
      sel.addEventListener('change',function(e){
        var v=e.target.value;
        // 同じ人を2枠に選ばない
        if(v&&selectedSlots.some(function(s,j){return j!==idx&&s===v;})){
          showToast('「'+v+'」は既に選択されています');
          e.target.value=selectedSlots[idx]||'';return;
        }
        selectedSlots[idx]=v;renderGames();renderTotals();renderGoriyaku();markDirty();
      });
    })(i);
    var arrow=document.createElement('span');arrow.className='slot-arrow';arrow.textContent='▼';
    wrap.appendChild(sel);wrap.appendChild(arrow);grid.appendChild(wrap);
  }
}

function dn(i){return selectedSlots[i]||'P'+(i+1);}

function defaultPtsForCount(n){
  if(n<=1)return[0];if(n===2)return[5,-5];if(n===3)return[5,0,-5];
  if(n===4)return[5,3,-3,-5];if(n===5)return[5,3,0,-3,-5];
  var arr=Array(n).fill(0);arr[0]=5;arr[1]=3;arr[n-2]=-3;arr[n-1]=-5;return arr;
}

function getPts(gi){return games[gi].customPoints||defaultPtsForCount(playerCount);}
function getPtByRank(gi,rank){var p=getPts(gi);return p[rank-1]!==undefined?p[rank-1]:0;}

function addGame(){
  games.push({ranks:Array(playerCount).fill(null),customPoints:null});
  renderGames();renderTotals();renderGoriyaku();updateGameCount();markDirty();
  setTimeout(function(){var c=document.getElementById('gamesContainer');if(c&&c.firstElementChild)c.firstElementChild.scrollIntoView({behavior:'smooth',block:'center'});},60);
}

// ご祝儀のゲーム番号を、ゲーム削除に合わせてずらす
function shiftGoriyakuAfterDelete(items,idx){
  return items.filter(function(it){return it.gameIdx!==idx;}).map(function(it){
    return it.gameIdx>idx?{gameIdx:it.gameIdx-1,playerIdx:it.playerIdx,playerName:it.playerName,amount:it.amount}:it;
  });
}

function deleteGame(idx){
  if(!games[idx])return;
  var g=games[idx];
  var hasInput=g.ranks.some(function(r){return r!==null;})||goriyakuItems.some(function(it){return it.gameIdx===idx;});
  if(hasInput&&!confirm('GAME '+(idx+1)+' を削除しますか？\n（このゲームのご祝儀も削除されます）'))return;
  games.splice(idx,1);
  goriyakuItems=shiftGoriyakuAfterDelete(goriyakuItems,idx);
  var newOpen={};Object.keys(gameGoriyakuOpen).forEach(function(k){var i=parseInt(k);if(i<idx)newOpen[i]=gameGoriyakuOpen[k];else if(i>idx)newOpen[i-1]=gameGoriyakuOpen[k];});
  gameGoriyakuOpen=newOpen;
  renderGames();renderTotals();renderGoriyaku();updateGameCount();markDirty();
}

function setRank(gi,pi,val){
  if(!games[gi])return;
  if(val==='dnp')games[gi].ranks[pi]='dnp';
  else games[gi].ranks[pi]=val?parseInt(val):null;
  renderGameCard(gi);renderTotals();renderGoriyaku();markDirty();
}

var gameGoriyakuOpen={};  // ゲームカードのご祝儀エリア開閉状態

function toggleGameGoriyaku(gi){
  gameGoriyakuOpen[gi]=!gameGoriyakuOpen[gi];
  renderGameCard(gi);
}

function addGameGoriyakuItem(gi){
  var playerSel=document.getElementById('ggSel'+gi);
  var amountEl=document.getElementById('ggAmt'+gi);
  if(!playerSel||!amountEl||!games[gi])return;
  var pi=playerSel.value;
  var amt=Math.round(Number(amountEl.value));
  if(pi===''){showToast('受取人を選択してください');return;}
  if(!isFinite(amt)||amt<=0){showToast('金額を入力してください');return;}
  if(amt>1000000){showToast('金額が大きすぎます');return;}
  goriyakuItems.push({gameIdx:gi,playerIdx:parseInt(pi),playerName:dn(parseInt(pi)),amount:amt});
  gameGoriyakuOpen[gi]=true;
  renderGameCard(gi);
  renderGoriyaku();markDirty();
}

function toggleCustomPts(gi){
  var g=games[gi];if(!g)return;
  g.customPoints=g.customPoints?null:defaultPtsForCount(playerCount).slice();
  renderGameCard(gi);renderTotals();renderGoriyaku();markDirty();
}

function setCustomPt(gi,ri,val){
  if(!games[gi]||!games[gi].customPoints)return;
  games[gi].customPoints[ri]=toInt(val);
  // カードを描き直さずに表示だけ更新（次の欄へ移ったカーソルが外れないように）
  updateCardPreviews(gi);renderTotals();renderGoriyaku();markDirty();
}
function updateCardPreviews(gi){
  var c=document.getElementById('gamesContainer'),card=c&&c.children[games.length-1-gi];if(!card)return;
  var pts=getPts(gi);
  card.querySelectorAll('.game-pts-input').forEach(function(inp,i){if(document.activeElement!==inp)inp.value=pts[i]||0;});
  card.querySelectorAll('.rank-row .pt-preview').forEach(function(el,pi){
    var r=games[gi].ranks[pi],cls='',str='—';
    if(r==='dnp'){cls='pt-zero';str='不参加';}
    else if(r!==null){var v=pts[r-1]||0;cls=v>0?'pt-pos':v<0?'pt-neg':'pt-zero';str=fmtYen(v);}
    el.className='pt-preview '+cls;el.textContent=str;
  });
}

function renderGames(){
  var c=document.getElementById('gamesContainer');c.innerHTML='';
  for(var gi=games.length-1;gi>=0;gi--)c.appendChild(createGameCard(gi));
  updateGameCount();
}

function renderGameCard(gi){
  var c=document.getElementById('gamesContainer'),domIdx=games.length-1-gi;
  var old=c.children[domIdx];if(!old||!games[gi])return;
  try{c.replaceChild(createGameCard(gi),old);}catch(e){renderGames();}
}

function createGameCard(gi){
  var g=games[gi],hasCustom=!!g.customPoints,pts=getPts(gi);
  var ranks=g.ranks.filter(function(r){return r!==null&&r!=='dnp';}),hasDup=ranks.length!==new Set(ranks).size;
  var customHtml='';
  for(var i=0;i<playerCount;i++)customHtml+='<div class="game-pts-item"><label>'+(i+1)+'位</label>'+ptsInputHtml('game-pts-input',pts[i],'setCustomPt('+gi+','+i+',this.value)')+'</div>';
  var rowsHtml='';
  for(var pi=0;pi<playerCount;pi++){
    var r=g.ranks[pi],ptCls,ptStr;
    if(r==='dnp'){ptCls='pt-zero';ptStr='不参加';}
    else if(r===null){ptCls='';ptStr='—';}
    else{var ptVal=pts[r-1]||0;ptCls=ptVal>0?'pt-pos':ptVal<0?'pt-neg':'pt-zero';ptStr=fmtYen(ptVal);}
    var opts='<option value=""'+(r===null?' selected':'')+'>—</option>';
    for(var n=1;n<=playerCount;n++)opts+='<option value="'+n+'"'+(r===n?' selected':'')+'>'+n+'位</option>';
    opts+='<option value="dnp"'+(r==='dnp'?' selected':'')+'>不参加</option>';
    rowsHtml+='<div class="rank-row"><span class="pname">'+esc(dn(pi))+'</span><select class="rank-select" onchange="setRank('+gi+','+pi+',this.value)">'+opts+'</select><span class="pt-preview '+ptCls+'">'+ptStr+'</span></div>';
  }
  // ゲームのご祝儀エントリー取得
  var gameGoriyaku=goriyakuItems.filter(function(it){return it.gameIdx===gi;});
  var hasGoriyaku=gameGoriyaku.length>0;
  var goriyakuItemsHtml=gameGoriyaku.map(function(item){
    var realIdx=goriyakuItems.indexOf(item);
    return'<div class="game-goriyaku-item"><span class="game-goriyaku-item-name">'+esc(dn(item.playerIdx))+'</span><span class="game-goriyaku-item-amount">'+gorDetailHtml(item,games)+'</span><button class="game-goriyaku-item-del" onclick="deleteGoriyakuItem('+realIdx+')">✕</button></div>';
  }).join('');
  var goriyakuOpen=gameGoriyakuOpen[gi]||hasGoriyaku;
  var playerOptsHtml='<option value="">受取人</option>';
  for(var pi2=0;pi2<playerCount;pi2++)playerOptsHtml+='<option value="'+pi2+'">'+esc(dn(pi2))+'</option>';
  var card=document.createElement('div');card.className='game-card';
  card.innerHTML='<div class="game-card-header"><span class="game-num">GAME '+(gi+1)+'</span><div class="game-card-actions"><button class="pts-toggle-btn'+(hasCustom?' active':'')+'" onclick="toggleCustomPts('+gi+')">'+(hasCustom?'⚙ カスタム配点中':'⚙ 配点設定')+'</button><button class="goriyaku-toggle-btn'+(hasGoriyaku?' active':'')+'" onclick="toggleGameGoriyaku('+gi+')">'+(hasGoriyaku?'🎁 ご祝儀中':'🎁 ご祝儀')+'</button><button class="del-btn" onclick="deleteGame('+gi+')">✕</button></div></div><div class="game-pts-area'+(hasCustom?' open':'')+'"><div class="game-pts-grid">'+customHtml+'</div></div><div class="game-goriyaku-area'+(goriyakuOpen?' open':'')+'"><div class="game-goriyaku-form"><select class="game-goriyaku-select" id="ggSel'+gi+'">'+playerOptsHtml+'</select><span style="font-size:.72rem;color:#c07aff;margin:0 2px;">¥</span><input class="game-goriyaku-amount" type="number" inputmode="numeric" id="ggAmt'+gi+'" placeholder="1人あたり" min="0" step="100"><button class="game-goriyaku-add-btn" onclick="addGameGoriyakuItem('+gi+')">＋ 追加</button></div><div class="gor-hint">金額は「他の人1人あたり」から受け取る額</div>'+(goriyakuItemsHtml?'<div class="game-goriyaku-items">'+goriyakuItemsHtml+'</div>':'')+'</div><div class="rank-inputs">'+rowsHtml+'</div>'+(hasDup?'<div class="dup-warn">⚠ 同じ順位が重複しています</div>':'');
  return card;
}

function ptToYen(pt){return pt*100;}
function fmtYenRaw(y){y=Math.round(y)||0;return(y>0?'+':'')+y.toLocaleString()+'円';}

// ------------------------------------------------------
// ご祝儀：入力額は「他の参加者1人あたり」の金額
//   受取人：＋ 金額 × （そのゲームの参加者 − 自分）
//   ほかの参加者：それぞれ − 金額
//   （そのゲームを「不参加」にした人は払わない）
// ------------------------------------------------------
function gorPayers(ranks,recv){var a=[];(ranks||[]).forEach(function(r,pi){if(pi!==recv&&r!=='dnp')a.push(pi);});return a;}
function gorItemTotal(item,gms){var g=gms[item.gameIdx];return g?item.amount*gorPayers(g.ranks,item.playerIdx).length:0;}
function gorAdjust(n,gms,items){
  var adj=Array(n).fill(0);
  (items||[]).forEach(function(it){
    var g=gms[it.gameIdx];if(!g||it.playerIdx>=n)return;
    var payers=gorPayers(g.ranks,it.playerIdx);
    adj[it.playerIdx]+=it.amount*payers.length;
    payers.forEach(function(p){adj[p]-=it.amount;});
  });
  return adj;
}
// 円での合計（配点 ×100円 ＋ ご祝儀の受け取り/支払い）
function yenTotals(ptTotals,gms,items){var adj=gorAdjust(ptTotals.length,gms,items);return ptTotals.map(function(p,i){return ptToYen(p||0)+adj[i];});}
function gorDetailHtml(item,gms){
  var g=gms[item.gameIdx],cnt=g?gorPayers(g.ranks,item.playerIdx).length:0;
  return'¥'+item.amount.toLocaleString()+' × '+cnt+'人 = <b>¥'+(item.amount*cnt).toLocaleString()+'</b>';
}

// マイナス入力対応：全角や「−」「ー」も受け付ける
function toInt(v){
  var s=String(v==null?'':v).replace(/[０-９]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);}).replace(/[−ー－‐―]/g,'-').replace(/[^0-9\-]/g,'');
  var n=parseInt(s,10);return isNaN(n)?0:n;
}
// 配点入力欄（±ボタン付き。iPhoneの数字キーボードには − が無いため）
function ptsInputHtml(cls,val,onchangeJs){
  return'<span class="pts-field"><button type="button" class="pm-btn" onclick="flipSign(this)">±</button><input class="'+cls+'" type="text" inputmode="numeric" pattern="-?[0-9]*" value="'+(val||0)+'" onfocus="this.select()" onchange="'+onchangeJs+'"></span>';
}
function flipSign(btn){
  var inp=btn.nextElementSibling;if(!inp)return;
  inp.value=String(-toInt(inp.value));
  inp.dispatchEvent(new Event('change'));
}
function fmtYen(pt){var y=ptToYen(pt);return(y>0?'+':'')+y.toLocaleString()+'円';}
function fmtYenAbs(pt){return Math.abs(ptToYen(pt)).toLocaleString()+'円';}

function calcTotals(){
  var t=Array(playerCount).fill(0);
  games.forEach(function(g,gi){g.ranks.forEach(function(r,pi){if(r!==null&&r!=='dnp')t[pi]+=getPtByRank(gi,r);});});
  return t;
}

function renderTotals(){
  var totals=yenTotals(calcTotals(),games,goriyakuItems),sorted=totals.map(function(s,i){return{i:i,s:s};}).sort(function(a,b){return b.s-a.s;});
  var card=document.getElementById('totalCard');
  if(games.length===0){card.innerHTML='<div class="total-empty">合計スコアはここに表示されます</div>';}
  else{card.innerHTML=sorted.map(function(item,rank){var s=item.s,cls=rank<3?'rank-'+(rank+1):'',ptCls=s>0?'pt-pos':s<0?'pt-neg':'pt-zero';return'<div class="total-pill '+cls+'"><span class="pill-medal">'+(MEDALS[rank]||'')+'</span><span class="pill-name">'+esc(dn(item.i))+'</span><span class="pill-score '+ptCls+'">'+fmtYenRaw(s)+'</span></div>';}).join('');}
  var completeGames=games.filter(function(g){return g.ranks.every(function(r){return r!==null;});});
  var bc=document.getElementById('balanceCard');
  if(completeGames.length===0){bc.innerHTML='';return;}
  var sum=completeGames.reduce(function(acc,g){var gi=games.indexOf(g);return acc+g.ranks.reduce(function(a,r){return a+(r==='dnp'?0:getPtByRank(gi,r));},0);},0);
  var isOk=sum===0;
  bc.innerHTML='<div class="balance-card '+(isOk?'ok':'ng')+'"><div class="balance-left"><span class="balance-icon">'+(isOk?'✅':'⚠️')+'</span><div><div class="balance-title">'+(isOk?'バランス OK':'バランスが合いません')+'</div><div class="balance-sub">完全入力 '+completeGames.length+'ゲーム分の合計</div></div></div><span class="balance-num">'+fmtYen(sum)+'</span></div>';
}

function updateGameCount(){document.getElementById('gameCount').textContent=games.length+' GAMES';}

function saveSession(){
  if(isSaving)return;   // 連打で二重保存しない
  if(games.length===0){showToast('ゲームがありません');return;}
  if(currentSessionId&&!isDirty){showToast('✓ 保存済みです（変更なし）');return;}
  // 入力チェック（警告のみ。OKならそのまま保存できる）
  var warns=[];
  var incomplete=[],dup=[];
  games.forEach(function(g,gi){
    if(g.ranks.some(function(r){return r===null;}))incomplete.push(gi+1);
    var rk=g.ranks.filter(function(r){return r!==null&&r!=='dnp';});
    if(rk.length!==new Set(rk).size)dup.push(gi+1);
  });
  if(incomplete.length)warns.push('・順位が未入力：GAME '+incomplete.join(', '));
  if(dup.length)warns.push('・順位が重複：GAME '+dup.join(', '));
  var unnamed=[];for(var i=0;i<playerCount;i++)if(!selectedSlots[i])unnamed.push('P'+(i+1));
  if(unnamed.length)warns.push('・名前が未選択：'+unnamed.join(', '));
  if(warns.length&&!confirm('次の項目を確認してください。\n\n'+warns.join('\n')+'\n\nこのまま保存しますか？'))return;

  var isUpdate=!!currentSessionId;
  var sid=currentSessionId||Date.now();
  var session={
    id:sid,
    date:new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}),
    playerCount:playerCount,
    names:selectedSlots.slice(),
    games:games.map(function(g){return{ranks:g.ranks.slice(),customPoints:g.customPoints?g.customPoints.slice():null};}),
    totals:calcTotals()
  };
  if(goriyakuItems.length>0){
    // 受取人の名前は保存時点の名前で確定させる
    session.goriyaku={items:goriyakuItems.map(function(it){return{gameIdx:it.gameIdx,playerIdx:it.playerIdx,playerName:dn(it.playerIdx),amount:it.amount};})};
  }
  isSaving=true;
  var btn=document.querySelector('.save-btn');if(btn)btn.disabled=true;
  var done=function(){isSaving=false;if(btn)btn.disabled=false;};
  updateData(function(d){
    var idx=d.sessions.findIndex(function(x){return x.id===sid;});
    if(idx>=0){session.date=d.sessions[idx].date||session.date;d.sessions[idx]=Object.assign({},d.sessions[idx],session);if(!session.goriyaku&&d.sessions[idx].goriyaku&&!d.sessions[idx].goriyaku.amounts)delete d.sessions[idx].goriyaku;}
    else d.sessions.unshift(session);
  },function(){
    done();
    currentSessionId=sid;isDirty=false;persistDraft();
    showToast(isUpdate?'💾 上書き保存しました！':'💾 保存しました！');
  },function(){done();});
}

function renderStats(){
  var sessions=getSessions(),card=document.getElementById('statsCard');
  if(sessions.length===0){card.innerHTML='<div class="stats-empty">📭 まだ記録がありません</div>';return;}
  var userMap={};
  sessions.forEach(function(s){
    s.names.forEach(function(name,i){
      var nm=(name&&name.trim())?name.trim():'P'+(i+1);
      if(!userMap[nm])userMap[nm]={total:0,gameCount:0,sessionCount:0};
      var played=s.games.filter(function(g){return g.ranks[i]!==null&&g.ranks[i]!=='dnp';}).length;
      userMap[nm].total+=(s.yen?s.yen[i]:ptToYen(s.totals[i]||0))||0;
      if(played>0)userMap[nm].sessionCount++;
      userMap[nm].gameCount+=played;
    });
  });
  var sorted=Object.entries(userMap).map(function(e){return{name:e[0],total:e[1].total,gameCount:e[1].gameCount,sessionCount:e[1].sessionCount};}).sort(function(a,b){return b.total-a.total;});
  card.innerHTML=sorted.map(function(u,rank){
    var cls=rank<3?'stats-row rank-'+(rank+1):'stats-row',ptCls=u.total>0?'pt-pos':u.total<0?'pt-neg':'pt-zero',avgYen=u.gameCount>0?Math.round(u.total/u.gameCount):0;
    return'<div class="'+cls+'"><div class="stats-left"><span class="stats-medal">'+(MEDALS[rank]||'')+'</span><div><div class="stats-name">'+esc(u.name)+'</div><div class="stats-sub">'+u.sessionCount+'回参加 / '+u.gameCount+'ゲーム / 平均'+(avgYen>0?'+':'')+avgYen.toLocaleString()+'円</div></div></div><div class="stats-right"><div class="stats-total '+ptCls+'">'+fmtYenRaw(u.total)+'</div></div></div>';
  }).join('');
}

// 編集内容が元の記録から変わっているか
function isDraftChanged(id){
  var es=editStates[id];if(!es||!es.draft)return false;
  var s=getSessions().find(function(x){return x.id===id;});if(!s)return false;
  var orig={names:s.names,games:s.games.map(function(g){return{ranks:g.ranks,customPoints:g.customPoints||null};}),goriyakuItems:(s.goriyaku&&s.goriyaku.items)||[]};
  var cur={names:es.draft.names,games:es.draft.games.map(function(g){return{ranks:g.ranks,customPoints:g.customPoints||null};}),goriyakuItems:es.draft.goriyakuItems};
  return JSON.stringify(orig)!==JSON.stringify(cur);
}

function toggleHistOpen(id){
  if(!editStates[id])editStates[id]={open:false,editMode:false};
  if(editStates[id].open&&editStates[id].editMode&&isDraftChanged(id)&&!confirm('編集中の内容を破棄して閉じますか？'))return;
  editStates[id].open=!editStates[id].open;
  if(!editStates[id].open){editStates[id].editMode=false;delete editStates[id].draft;}
  renderHistory();
}

function toggleHistEdit(id){
  if(!editStates[id])editStates[id]={open:true,editMode:false};
  if(editStates[id].editMode&&isDraftChanged(id)&&!confirm('編集中の内容を破棄しますか？'))return;
  editStates[id].editMode=!editStates[id].editMode;
  editStates[id].open=true;
  if(!editStates[id].editMode&&editStates[id].draft)delete editStates[id].draft;
  renderHistory();
}

function deleteSession(id){
  var target=getSessions().find(function(s){return s.id===id;});if(!target)return;
  showConfirmModal(esc(target.date)+' の記録を削除しますか？','この操作は取り消せません',function(){
    updateData(function(d){
      d.sessions=d.sessions.filter(function(s){return s.id!==id;});
    },function(){
      if(editStates[id])delete editStates[id];
      // 記録画面で保存中のセッションを消した場合、次の保存は新規として扱う
      if(currentSessionId===id){currentSessionId=null;isDirty=true;persistDraft();}
      renderHistory();showToast('🗑 削除しました');
    },null,{allowDelete:true});
  });
}

function showConfirmModal(title,sub,onConfirm){
  var old=document.getElementById('confirmModal');if(old)old.remove();
  var modal=document.createElement('div');modal.id='confirmModal';modal.className='confirm-modal';
  modal.innerHTML='<div class="confirm-backdrop"></div><div class="confirm-box"><div class="confirm-title">'+title+'</div><div class="confirm-sub">'+sub+'</div><div class="confirm-actions"><button type="button" class="confirm-cancel">キャンセル</button><button type="button" class="confirm-ok">削除</button></div></div>';
  document.body.appendChild(modal);
  var close=function(){modal.remove();};
  modal.querySelector('.confirm-backdrop').addEventListener('click',close);
  modal.querySelector('.confirm-cancel').addEventListener('click',close);
  modal.querySelector('.confirm-ok').addEventListener('click',function(){close();onConfirm();});
}

}

function findSession(id){return getSessions().find(function(x){return x.id===id;});}
function editSlot(id,i,sel){
  var s=findSession(id);if(!s)return;var draft=getEditDraft(s);var val=sel.value;
  if(val&&draft.names.some(function(nm,j){return j!==i&&nm===val;})){showToast('「'+val+'」は既に選択されています');sel.value=draft.names[i]||'';return;}
  draft.names[i]=val;
}
function editRank(id,gi,pi,val){
  var s=findSession(id);if(!s)return;var draft=getEditDraft(s);if(!draft.games[gi])return;
  if(val==='dnp')draft.games[gi].ranks[pi]='dnp';else draft.games[gi].ranks[pi]=val?parseInt(val):null;
  var pts=draft.games[gi].customPoints||defaultPtsForCount(s.playerCount),r=draft.games[gi].ranks[pi];
  var ptCls,ptStr;
  if(r==='dnp'){ptCls='pt-zero';ptStr='不参加';}else if(r===null){ptCls='';ptStr='—';}else{var ptVal=pts[r-1]||0;ptCls=ptVal>0?'pt-pos':ptVal<0?'pt-neg':'pt-zero';ptStr=fmtYen(ptVal);}
  var el=document.getElementById('epp-'+id+'-'+gi+'-'+pi);if(el){el.className='edit-pt-preview '+ptCls;el.textContent=ptStr;}
}
function editToggleCustomPts(id,gi){
  var s=findSession(id);if(!s)return;var draft=getEditDraft(s);if(!draft.games[gi])return;
  draft.games[gi].customPoints=draft.games[gi].customPoints?null:defaultPtsForCount(s.playerCount).slice();renderHistory();
}
function editGamePt(id,gi,ri,val){var s=findSession(id);if(!s)return;var draft=getEditDraft(s);if(draft.games[gi]&&draft.games[gi].customPoints)draft.games[gi].customPoints[ri]=toInt(val);
  draft.games[gi].ranks.forEach(function(r,pi){
    var el=document.getElementById('epp-'+id+'-'+gi+'-'+pi);if(!el||r===null||r==='dnp')return;
    var v=draft.games[gi].customPoints[r-1]||0;el.className='edit-pt-preview '+(v>0?'pt-pos':v<0?'pt-neg':'pt-zero');el.textContent=fmtYen(v);
  });}
function editAddGoriyaku(id){
  var s=getSessions().find(function(x){return x.id===id;});if(!s)return;
  var draft=getEditDraft(s);
  var gameSel=document.getElementById('egGame'+id);
  var playerSel=document.getElementById('egPlayer'+id);
  var amtEl=document.getElementById('egAmt'+id);
  if(!gameSel||!playerSel||!amtEl)return;
  var gi=gameSel.value;
  var pi=playerSel.value;
  var amt=Math.round(Number(amtEl.value));
  if(gi===''){showToast('ゲームを選択してください');return;}
  if(pi===''){showToast('受取人を選択してください');return;}
  if(!isFinite(amt)||amt<=0){showToast('金額を入力してください');return;}
  if(amt>1000000){showToast('金額が大きすぎます');return;}
  var nm=draft.names[parseInt(pi)]||'P'+(parseInt(pi)+1);
  draft.goriyakuItems.push({gameIdx:parseInt(gi),playerIdx:parseInt(pi),playerName:nm,amount:amt});
  renderHistory();
}

function editDeleteGoriyaku(id,idx){
  var s=getSessions().find(function(x){return x.id===id;});if(!s)return;
  var draft=getEditDraft(s);
  draft.goriyakuItems.splice(idx,1);
  renderHistory();
}

function editAddGame(id){
  var s=getSessions().find(function(x){return x.id===id;});if(!s)return;
  var draft=getEditDraft(s);
  draft.games.push({ranks:Array(s.playerCount).fill(null),customPoints:null});
  renderHistory();
}

function editDeleteGame(id,gi){
  var s=getSessions().find(function(x){return x.id===id;});if(!s)return;
  var draft=getEditDraft(s);
  if(draft.games.length<=1){showToast('ゲームは1つ以上必要です');return;}
  var hasGor=draft.goriyakuItems.some(function(it){return it.gameIdx===gi;});
  if(!confirm('GAME '+(gi+1)+' を削除しますか？'+(hasGor?'\n（このゲームのご祝儀も削除されます）':'')))return;
  draft.games.splice(gi,1);
  draft.goriyakuItems=shiftGoriyakuAfterDelete(draft.goriyakuItems,gi);
  renderHistory();
}

var committing={};
function commitEdit(id){
  if(committing[id])return;
  var s=findSession(id);if(!s||!editStates[id]||!editStates[id].draft)return;
  var draft=editStates[id].draft;
  var n=s.playerCount;
  var names=draft.names.slice();
  var gms=draft.games.map(function(g){return{ranks:g.ranks.slice(),customPoints:g.customPoints?g.customPoints.slice():null};});
  var dup=[];gms.forEach(function(g,gi){var rk=g.ranks.filter(function(r){return r!==null&&r!=='dnp';});if(rk.length!==new Set(rk).size)dup.push(gi+1);});
  if(dup.length&&!confirm('GAME '+dup.join(', ')+' で順位が重複しています。\nこのまま保存しますか？'))return;
  var items=draft.goriyakuItems.filter(function(it){return it.gameIdx<gms.length&&it.playerIdx<n;}).map(function(it){
    var nm=(names[it.playerIdx]&&names[it.playerIdx].trim())?names[it.playerIdx].trim():'P'+(it.playerIdx+1);
    return{gameIdx:it.gameIdx,playerIdx:it.playerIdx,playerName:nm,amount:it.amount};
  });
  var totals=Array(n).fill(0);
  gms.forEach(function(g){var pts=g.customPoints||defaultPtsForCount(n);g.ranks.forEach(function(r,pi){if(r!==null&&r!=='dnp'&&pi<n)totals[pi]+=(pts[r-1]||0);});});
  committing[id]=true;
  updateData(function(d){
    var idx=d.sessions.findIndex(function(x){return x.id===id;});
    if(idx===-1)return false;  // 他の端末で削除済み
    var t=d.sessions[idx];
    t.names=names;t.games=gms;t.totals=totals;
    var legacy=(t.goriyaku&&t.goriyaku.amounts)?t.goriyaku.amounts:null;
    var g={};if(legacy){g.amounts=legacy;if(t.goriyaku.threshold!=null)g.threshold=t.goriyaku.threshold;}
    if(items.length>0)g.items=items;
    if(Object.keys(g).length)t.goriyaku=g;else delete t.goriyaku;
  },function(){
    committing[id]=false;
    if(editStates[id]){delete editStates[id].draft;editStates[id].editMode=false;}
    renderHistory();showToast('✅ 更新しました！');
  },function(e){
    committing[id]=false;
    if(e===undefined){showToast('⚠ この記録は他の端末で削除されています');if(editStates[id])delete editStates[id];renderHistory();}
  });
}

// ======================================================
// ご祝儀セクション
// ======================================================
function renderGoriyaku(){
  // 集計リスト描画（下部パネル）
  var listEl=document.getElementById('goriyakuList');
  if(listEl){
    if(goriyakuItems.length===0){
      listEl.innerHTML='<div class="goriyaku-list-empty">ご祝儀はまだありません</div>';
    }else{
      listEl.innerHTML=goriyakuItems.map(function(item,idx){
        return'<div class="goriyaku-item">'
          +'<span class="goriyaku-item-game">GAME '+(item.gameIdx+1)+'</span>'
          +'<span class="goriyaku-item-name">'+esc(dn(item.playerIdx))+'</span>'
          +'<span class="goriyaku-item-amount">'+gorDetailHtml(item,games)+'</span>'
          +'</div>';
      }).join('');
    }
  }
  // 合計更新
  var grand=goriyakuItems.reduce(function(a,b){return a+gorItemTotal(b,games);},0);
  var totalEl=document.getElementById('goriyakuTotal');
  if(totalEl)totalEl.textContent='¥ '+grand.toLocaleString();
}

function deleteGoriyakuItem(idx){
  var it=goriyakuItems[idx];if(!it)return;
  if(!confirm(dn(it.playerIdx)+' へのご祝儀（1人あたり¥'+it.amount.toLocaleString()+'）を削除しますか？'))return;
  var gi=it.gameIdx;
  goriyakuItems.splice(idx,1);
  renderGameCard(gi);
  renderGoriyaku();markDirty();
}

function resetAll(){
  if(!hasInProgressData()&&!currentSessionId)return;
  var msg=isDirty&&games.length>0?'⚠ 未保存の変更があります！\n\n':'';
  if(!confirm(msg+'現在の入力をリセットしますか？\n（保存済み履歴は消えません）'))return;
  games=[];goriyakuItems=[];gameGoriyakuOpen={};currentSessionId=null;isDirty=false;
  renderGames();renderTotals();renderGoriyaku();persistDraft();
}

var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2600);}

// ============================================================
// ページ離脱/リロード保護
//  ・PC/Android：離脱前に確認ダイアログ
//  ・iPhone：確認ダイアログが出せないため、端末内に自動バックアップして次回起動時に復元
// ============================================================
window.addEventListener('beforeunload',function(e){
  persistDraft();
  if(hasInProgressData()&&isDirty){
    e.preventDefault();
    e.returnValue='入力中のデータが保存されていません。ページを離れますか？';
    return e.returnValue;
  }
});
window.addEventListener('pagehide',persistDraft);

// 画面に戻ってきた時：記録中のデータには触れず、履歴・集計だけ最新化
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){persistDraft();return;}
  if(!appReady)return;
  db.ref('bowling').get().then(function(snap){
    cachedData=normalizeData(snap.val());
    refreshActivePanel();updateNameGridOptions();
  }).catch(function(){});
});

// ============================================================
// 起動
// ============================================================
(function init(){
  var restored=restoreDraft();
  var start=function(){
    appReady=true;
    renderRoster();
    setCount(playerCount);
    if(!FB_OK){showToast('⚠ サーバーに接続できません（この端末だけで動作中・共有されません）');setSyncStatus('ng');}
    else if(restored)showToast(currentSessionId&&!isDirty?'↩ 前回の記録を復元しました（保存済み）':'↩ 保存前の入力を復元しました');
  };
  // 通信が遅くても入力できるよう、3秒で先に画面を出す
  var started=false;
  var go=function(){if(started)return;started=true;start();};
  setTimeout(go,3000);
  loadData(function(){if(started){updateNameGridOptions();refreshActivePanel();}else go();});
})();
</script>
